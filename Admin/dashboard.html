<!DOCTYPE html>

<html lang="en-GB">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <link rel="stylesheet" href="/Admin/styles/dashboard.css">
        <link rel="shortcut icon" href="/Assets/Images/Icon.png" type="image/x-icon">
        <script src="/Admin/scripts/dashboard.js"></script>
        <link rel="manifest" href="/manifest.json">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="icon" type="image/png" href="/Assets/Favicon/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/Assets/Favicon/favicon.svg" />
        <link rel="apple-touch-icon" sizes="180x180" href="/Assets/Favicon/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="VoxForm Admin" />
        <link rel="manifest" href="/Assets/Favicon/site.webmanifest" />
        <meta name="robots" content="noindex"/>
        <title>Admin Dashboard | VoxForm</title>
    </head>
    <body>
        <div id="header">
            <img id="headerLogo" src="/Assets/Images/Logo.png" alt="VoxForm Logo">

            <div id="userDiv">
                <span id="usernameText"></span>
                <a id="logoutBtn" href="logout.php">Logout</a>
            </div>
        </div>

        <div id="content">
            <div id="orderDiv">
                <div id="filterBtns">
                    <button onclick="filter('orders')" class="selectedFilter" id="filterOrders">Orders</button>
                    <button onclick="filter('otherOrders')" class="unSelectedFilter" id="filterOtherOrders">Other Orders</button>
                    <button onclick="filter('completedOrders')" class="unSelectedFilter" id="filterCompletedOrders">Completed Orders</button>
                </div>

                <div id="orders"></div>
                <div id="otherOrders" style="display: none;"></div>
                <div id="completedOrders" style="display: none;"></div>
            </div>

            <div id="assignOrderDiv" style="display: none;">
                <span id="assignOrderText"></span>
                <select id="assignOrderBox">
                    <option selected disabled value="">Select Assignee</option>
                    <option value="Jacob Waters">Jacob Waters</option>
                    <option value="Matthew Taylor">Matthew Taylor</option>
                </select>

                <button id="submitAssignee" onclick="assignOrder()">Submit</button>
                <button id="closeAssignee" onclick="assignClose()">Close</button>
            </div>

            <div id="quoteOrderDiv" style="display: none;">
                <span id="quoteOrderText"></span>
                <span id="quoteItemText"></span>

                <span id="filamentType1"></span>
                <span id="filamentColour1"></span>
                <span id="filamentType2"></span>
                <span id="filamentColour2"></span>
                <span id="personalisation"></span>
                <span id="style"></span>
                <span id="finish"></span>
                <span id="quantity"></span>
                <span id="quoteInfo"></span>

                <span id="fileDownload" style="display: none;"></span>

                <select id="priceCalcSelect" onchange="priceCalcChanged()">
                    <option selected disabled value="">Pricing Method</option>
                    <option value="Fixed Price">Fixed Price</option>
                    <option value="Calculated Price">Calculated Price</option>
                </select>

                <span style="display: none;" id="fixedPriceText">Fixed Price</span>
                <input style="display: none;" onkeyup="calculatePrice()" id="fixedPriceBox" type="text" placeholder="Enter price">

                <div style="display: none;" id="timeDiv">
                    <div>
                        <span id="hoursText">Hours</span>
                        <input type="number" onkeyup="calculatePrice()" id="hours" placeholder="Enter Hours" min="0">
                    </div>
                    <div>
                        <span id="minutesText">Minutes</span>
                        <input type="number" onkeyup="calculatePrice()" id="minutes" placeholder="Enter Minutes" min="0">
                    </div>
                </div>

                <div style="display: none;" id="materialCalcDiv">
                    <div>
                        <span id="filamentCostText">Filament Cost Per kg</span>
                        <input type="text" onkeyup="calculatePrice()" id="filamentCost" placeholder="Enter Cost Per kg" value="£16.00">
                    </div>
                    <div>
                        <span id="massText">Weight in grams</span>
                        <input type="number" onkeyup="calculatePrice()" id="mass" placeholder="Enter Weight (g)" min="0">
                    </div>
                </div>

                <span id="shippingHeading"></span>

                <input type="text" id="shippingPrice" onkeyup="calculatePrice()" placeholder="Enter Shipping Price">

                <span id="totalPrice">Total Price: <strong>£0.00</strong></span>

                <button id="submitQuote" onclick="submitQuote()">Submit</button>
                <button id="submitClose" onclick="closeQuote()">Close</button>
            </div>

            <div id="paidOrderDiv" style="display: none;">
                <span id="paidOrderText"></span>
                <span id="paidItemText"></span>
                <span id="itemMassText"></span>

                <span id="buyerInfoHeading"><strong>Buyer Info:</strong></span>
                <span id="nameText"></span>
                <span id="emailText"></span>
                <span id="phoneText"></span>

                <span id="addressHeading"><strong>Address:</strong></span>
                <span id="addressLine1Text"></span>
                <span id="addressLine2Text"></span>
                <span id="cityText"></span>
                <span id="countyText"></span>
                <span id="postcodeText"></span>
                <span id="countryText"></span>

                <input onchange="uploadVideo()" type="file" accept="video/*" capture="environment" id="video" style="display: none;">
                <button onclick="takeVideo()" id="videoButton">Take Video</button>
                <span id="videoText">Upload a Video</span>

                <button id="labelButton">Purchase a Label</button>
                <input placeholder="Enter tracking number" type="text" id="trackingNumber">

                <button id="submitShipping" onclick="submitShipping()">Submit</button>
                <button id="submit1Close" onclick="closeShipping()">Close</button>
            </div>

            <div id="completeOrderDiv" style="display: none;">
                <span id="completeOrderText"></span>

                <button id="submitComplete" onclick="submitComplete()">Submit</button>
                <button id="submit2Close" onclick="closeComplete()">Close</button>
            </div>

            <div id="dim" style="display: none;"></div>
        </div>
    </body>
</html>
