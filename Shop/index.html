<!DOCTYPE html>

<html lang="en-GB">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/Shop/styles.css">
        <link rel="shortcut icon" href="/Assets/Images/Icon.png" type="image/png">
        <script src="/Shop/script.js" defer></script>
        <link rel="canonical" href="https://voxform.co.uk/Shop/">
        <link rel="stylesheet" href="/Header/styles.css">
        <link rel="stylesheet" href="/Footer/styles.css">
        <script src="/Header/script.js" defer></script>
        <meta property="og:title" content="Shop | VoxForm">
        <meta property="og:description" content="Browse our catalogue.">
        <meta property="og:image" content="https://voxform.co.uk/Assets/Favicon/web-app-manifest-512x512.png">
        <meta property="og:url" content="https://voxform.co.uk/Shop/">
        <meta property="og:type" content="website">
        <meta name="twitter:card" content="summary_large_image">
        <title>Shop | VoxForm</title>
    </head>
    <body>
        <div id="header"></div>

        <div id="content">
            <span id="heading">Shop</span>
            <span id="subheading">Browse our catalogue</span>

            <div id="productsCard">
                <div onclick="window.location.href = '/Shop/Circuit%20Board%20Ruler/'">
                    <img src="/Assets/Images/Product/Circuit Board Ruler/Image 1.webp" alt="Circuit Board Ruler">
                    <span class="productName">Circuit Board Ruler</span>
                    <span class="productPrice">£3.50</span>
                </div>

                <div onclick="window.location.href = '/Shop/Dart%20Holder/'">
                    <img src="/Assets/Images/Product/Dart Holder/Image 1.webp" alt="Dart Holder">
                    <span class="productName">Dart Holder</span>
                    <span class="productPrice">Free Quote</span>
                </div>

                <div onclick="window.location.href = '/Shop/Plant%20Pot%20Label/'">
                    <img src="/Assets/Images/Product/Plant Pot Label/Image 1.webp" alt="Plant Pot Label">
                    <span class="productName">Plant Pot Label</span>
                    <span class="productPrice">Free Quote</span>
                </div>

                <div onclick="window.location.href = '/Shop/Portable%20Tic%20Tac%20Toe/'">
                    <img src="/Assets/Images/Product/Portable Tic Tac Toe/Image 1.webp" alt="Portable Tic Tac Toe">
                    <span class="productName">Portable Tic Tac Toe</span>
                    <span class="productPrice">Free Quote</span>
                </div>

                <div onclick="window.location.href = '/Shop/USB%20Stick%20Holder/'">
                    <img src="/Assets/Images/Product/USB Stick Holder/Image 1.webp" alt="USB Stick Holder">
                    <span class="productName">USB Stick Holder</span>
                    <span class="productPrice">Free Quote</span>
                </div>

            </div>
        </div>

        <div id="footer"></div>
    </body>
</html>
